<template>
    <lightning-card  title="One Way Data Binding">
     <div class="slds-p-around_medium">
          <div>First Number is :{firstnumber} </div>
           <div>Second Number is :{secondnumber}</div>
     </div>
        </lightning-card>

        <lightning-card  title="Two Way Data Binding">
           <div class="slds-p-around_medium">
               <lightning-input type="text" label="Enter Name" onchange={handleNameInputChange}></lightning-input>
               <lightning-input type="number" label="Enter Age" onchange={handleAgeInputChange}></lightning-input>
                <div>my Name is :{name} and my Age is :{age}</div>
           </div>
        </lightning-card>
</template>

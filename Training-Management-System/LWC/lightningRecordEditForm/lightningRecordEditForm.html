<template>
    <lightning-card  title="Lighting record edit form (Create Record)">
     <div class="slds-p-around_medium">
        <lightning-record-edit-form
          object-api-name={objectname}
             onsubmit={handleSubmit}
>         
         <lightning-messages> </lightning-messages>
         <lightning-input-field field-name={fields.firstnamefield}></lightning-input-field>
<lightning-input-field field-name={fields.lastnamefield}></lightning-input-field>
          <lightning-input-field field-name={fields.phonefield}> </lightning-input-field>
           <lightning-input-field field-name={fields.emailfield}> </lightning-input-field>
            <lightning-input-field field-name={fields.accountnamefield}> </lightning-input-field>
             <lightning-input-field field-name={fields.titlefield}> </lightning-input-field>
              <lightning-input-field field-name={fields.faxfield}> </lightning-input-field>
         <div class="slds-var-m-top_medium">
          <lightning-button variant="brand" type="submit" label="Save">
          </lightning-button>
    </div>
</lightning-record-edit-form>
     </div>
        </lightning-card>
</template>

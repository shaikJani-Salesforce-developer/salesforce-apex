<template>
      <lightning-card  title="Account Records">
     <div class="slds-p-around_medium">
       <template if:true={storeAccounts.data} for:each={storeAccounts.data} for:item="acc">
          <div class="slds-box slds-box_x-small" key ={acc.Id}>
              <p><b>Account Name :</b> {acc.Name}</p>
                  <p><b>Account Industry :</b> {acc.Industry}</p>
                      <p><b>Account Type :</b> {acc.Type}</p>
                    
                </div>
       </template>
     </div>
        </lightning-card>
</template>

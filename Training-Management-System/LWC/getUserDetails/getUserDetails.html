<template>
      <lightning-card  title="User Id">
     <div class="slds-p-around_medium">
       <div><b>User Id :</b> {userIdDetails}</div>
     </div>
        </lightning-card>

        <lightning-card  title="User Details By Using Function">
     <div class="slds-p-around_medium">
       <template if:true ={userDetailsf}>
         <div>Name of the User : {userDetailsf.Name.value}</div>
         <div>Email of the User :{userDetailsf.Email.value}</div>


       </template>
     </div>
        </lightning-card>

        <lightning-card  title="User Details By Using Property">
     <div class="slds-p-around_medium">
       <template if:true ={userDetailsf}>
         <div>Name of the User : {userDetailp.data.fields.Name.value}</div>
         <div>Email of the User :{userDetailp.data.fields.Email.value}</div>

       </template>
     </div>
        </lightning-card>
</template>

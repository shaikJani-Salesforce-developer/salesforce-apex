<template>
    <lightning-card  title="Fetch Opp Records By Using Imperative ">
     <div class="slds-p-around_medium">
       <lightning-input type = "text" label ="Enter Name" onchange={handleNameChange}></lightning-input> <br/>
        <lightning-button variant="brand" label="Click Here" title="Primary action" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>

       <template for:each={opportunityrecords} for:item="opportunity">
          
           <div class="slds-box slds-box_small" key={opportunity.Id}>
                <p><b>Id of the Opp </b>{opportunity.Id}</p>
                <p><b>Name of the Opp </b>{opportunity.Name}</p>
                <p><b>Stage Name of the Opp </b>{opportunity.StageName}</p>
                <p><b>Close Date of the Opp </b>{opportunity.CloseDate}</p>
                <p><b>Amount of the Opp </b>{opportunity.Amount}</p>
            </div>


       </template>
     </div>
        </lightning-card>
</template>

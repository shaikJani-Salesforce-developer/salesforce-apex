<template>
      <lightning-card title="Creating Account Record">
        <div class="slds-p-around_medium">
          <lightning-input type="text" label="Account Name"  name = "Name" onchange={handleInputNameChange}></lightning-input>
         <lightning-input type="text" label="Account Phone" name = "Phone" onchange={handleInputPhoneChange}></lightning-input>
         <lightning-input type="text" label="Account Fax"  name = "Fax"  onchange={handleInputFaxChange}></lightning-input> <br/>
                  <lightning-button variant="brand" label="Save" title="Primary action" onclick={saveRecord} class="slds-m-left_x-small"></lightning-button>

        </div>
    </lightning-card>
</template>
